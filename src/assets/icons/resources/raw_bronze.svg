        <ellipse cx="12" cy="11" rx="1.5" ry="1" fill="#A66B2B"/>
        <ellipse cx="17" cy="16" rx="2" ry="1.2" fill="#996633"/>
        <ellipse cx="11" cy="19" rx="1.2" ry="0.8" fill="#8B5A2B"/>
        <ellipse cx="18" cy="22" rx="1.5" ry="0.9" fill="#7A4A1A"/>
        <circle cx="15" cy="10" r="0.8" fill="#8B5A2B"/>
        <circle cx="21" cy="17" r="1" fill="#6B4513"/>

