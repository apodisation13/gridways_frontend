<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
  <rect width="100" height="100" fill="rgba(8,6,20,0.32)"/>

  <!-- Клубы тёмного тумана (темнее и активнее чем veil.svg) -->
  <ellipse cx="10" cy="28" rx="58" ry="20" fill="rgba(90,65,155,0.48)">
    <animateTransform attributeName="transform" type="translate" values="-15 0;45 10;-15 0" dur="6.2s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="95" cy="58" rx="62" ry="22" fill="rgba(65,48,120,0.40)">
    <animateTransform attributeName="transform" type="translate" values="0 0;-65 12;0 0" dur="8.8s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="40" cy="82" rx="52" ry="16" fill="rgba(110,85,175,0.50)">
    <animateTransform attributeName="transform" type="translate" values="0 0;35 -10;0 0" dur="5.8s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="-12" cy="65" rx="68" ry="24" fill="rgba(50,36,105,0.32)">
    <animateTransform attributeName="transform" type="translate" values="0 0;80 15;0 0" dur="10.5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="60" cy="8" rx="42" ry="14" fill="rgba(120,95,190,0.34)">
    <animateTransform attributeName="transform" type="translate" values="0 0;-32 5;0 0" dur="7.4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Пульсирующий глаз-туман в центре -->
  <ellipse cx="50" cy="50" rx="18" ry="9" fill="rgba(150,110,230,0.28)" stroke="rgba(185,155,255,0.42)" stroke-width="1.2">
    <animate attributeName="ry" values="9;11;9" dur="3.2s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="50" cy="50" r="5.5" fill="rgba(170,130,245,0.50)">
    <animate attributeName="opacity" values="0.35;0.75;0.35" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5.5;7;5.5" dur="2.8s" repeatCount="indefinite"/>
  </circle>
</svg>
