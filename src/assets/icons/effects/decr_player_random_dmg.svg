    <circle cx="54" cy="112" r="1.5" fill="rgba(30,55,115,0.85)"/>
    <circle cx="60" cy="112" r="1.5" fill="rgba(30,55,115,0.85)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 -138" dur="3.7s" begin="-2.2s" repeatCount="indefinite"/>
