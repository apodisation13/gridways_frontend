<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
  <!-- Лёгкий оттенок эффекта: прозрачный, как у rain/frost/incr_dmg. -->
  <rect width="100" height="100" fill="rgba(170,35,62,0.09)"/>

  <!-- Затухающие мечи урона: падают вниз, то есть сила атаки уменьшается. -->
  <g opacity="0">
    <polygon points="12,20 8,4 16,4" fill="rgba(225,205,210,0.82)"/>
    <rect x="7" y="3" width="10" height="2" rx=".7" fill="rgba(176,68,84,0.92)"/>
    <rect x="10.5" y="-3" width="3" height="6" rx=".6" fill="rgba(120,42,58,0.90)"/>
    <circle cx="12" cy="-4.5" r="2" fill="rgba(194,82,98,0.86)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 120" dur="2.8s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.88;.88;0" dur="2.8s" begin="0s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <polygon points="31,17 27,0 35,0" fill="rgba(214,193,200,0.75)"/>
    <rect x="26" y="-1" width="10" height="2" rx=".7" fill="rgba(161,57,76,0.84)"/>
    <rect x="29.5" y="-6" width="3" height="5" rx=".6" fill="rgba(108,36,52,0.84)"/>
    <circle cx="31" cy="-7.5" r="1.8" fill="rgba(180,67,87,0.78)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;-2 120" dur="3.5s" begin="-1.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.75;.75;0" dur="3.5s" begin="-1.1s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <polygon points="52,25 47,5 57,5" fill="rgba(238,215,220,0.90)"/>
    <rect x="46" y="3.7" width="12" height="2.3" rx=".8" fill="rgba(195,72,91,0.96)"/>
    <rect x="50" y="-3.3" width="4" height="7" rx=".7" fill="rgba(132,42,61,0.94)"/>
    <circle cx="52" cy="-5" r="2.3" fill="rgba(211,82,103,0.92)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 121" dur="2.35s" begin="-1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.95;.95;0" dur="2.35s" begin="-1.8s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <polygon points="72,19 68,2 76,2" fill="rgba(218,197,205,0.80)"/>
    <rect x="67" y="1" width="10" height="2" rx=".7" fill="rgba(168,59,79,0.88)"/>
    <rect x="70.5" y="-4.5" width="3" height="5.5" rx=".6" fill="rgba(110,37,53,0.87)"/>
    <circle cx="72" cy="-6" r="1.9" fill="rgba(185,69,89,0.83)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;-1 120" dur="3.15s" begin="-.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.82;.82;0" dur="3.15s" begin="-.5s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <polygon points="91,20 87,4 95,4" fill="rgba(226,204,211,0.84)"/>
    <rect x="86" y="3" width="10" height="2" rx=".7" fill="rgba(179,65,84,0.91)"/>
    <rect x="89.5" y="-3" width="3" height="6" rx=".6" fill="rgba(119,39,56,0.89)"/>
    <circle cx="91" cy="-4.5" r="2" fill="rgba(193,75,95,0.87)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 120" dur="3.9s" begin="-2.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.85;.85;0" dur="3.9s" begin="-2.3s" repeatCount="indefinite"/>
  </g>

  <!-- Метки уменьшения вспыхивают в разных частях поля — случайная карта игрока. -->
  <g fill="rgba(255,220,225,0.92)">
    <rect x="17" y="30" width="14" height="4" rx="2" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" dur="3.6s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="61" y="53" width="16" height="4.5" rx="2" opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;0" dur="3.6s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="33" y="77" width="13" height="4" rx="2" opacity="0">
      <animate attributeName="opacity" values="0;1;0;0;0" dur="3.6s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="76" y="20" width="12" height="3.5" rx="1.8" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;1" dur="3.6s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
