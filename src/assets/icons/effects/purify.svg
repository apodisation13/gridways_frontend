<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
  <rect width="100" height="100" fill="rgba(200,180,100,0.08)"/>
  <!-- diagonal light wash -->
  <rect x="-60" y="-10" width="38" height="120" fill="rgba(255,255,215,0.22)" transform="rotate(-22,50,50)">
    <animateTransform attributeName="transform" type="translate" values="-120 0;120 0;-120 0" dur="4.5s" repeatCount="indefinite" additive="sum"/>
  </rect>
  <!-- sparkle 1 -->
  <g transform="translate(18,18)" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0s" repeatCount="indefinite"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#ffd700" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#ffd700" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="-5" y1="-5" x2="5" y2="5" stroke="rgba(255,220,80,0.70)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="5" y1="-5" x2="-5" y2="5" stroke="rgba(255,220,80,0.70)" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- sparkle 2 -->
  <g transform="translate(72,28)" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="2.3s" begin="0.6s" repeatCount="indefinite"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#fff8b0" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#fff8b0" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="rgba(255,235,100,0.70)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="7" y1="-7" x2="-7" y2="7" stroke="rgba(255,235,100,0.70)" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- sparkle 3 -->
  <g transform="translate(42,62)" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="1.1s" repeatCount="indefinite"/>
    <line x1="0" y1="-7" x2="0" y2="7" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
    <line x1="-5" y1="-5" x2="5" y2="5" stroke="rgba(255,210,70,0.70)" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="5" y1="-5" x2="-5" y2="5" stroke="rgba(255,210,70,0.70)" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <!-- sparkle 4 -->
  <g transform="translate(82,75)" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="2.0s" begin="0.3s" repeatCount="indefinite"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#ffe060" stroke-width="2" stroke-linecap="round"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#ffe060" stroke-width="2" stroke-linecap="round"/>
    <line x1="-4" y1="-4" x2="4" y2="4" stroke="rgba(255,200,50,0.70)" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="4" y1="-4" x2="-4" y2="4" stroke="rgba(255,200,50,0.70)" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <!-- sparkle 5 -->
  <g transform="translate(15,82)" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="1.9s" begin="0.9s" repeatCount="indefinite"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#ffd700" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#ffd700" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-4" y1="-4" x2="4" y2="4" stroke="rgba(255,215,60,0.70)" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="4" y1="-4" x2="-4" y2="4" stroke="rgba(255,215,60,0.70)" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <!-- sparkle 6 -->
  <g transform="translate(55,42)" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="1.6s" repeatCount="indefinite"/>
    <line x1="0" y1="-11" x2="0" y2="11" stroke="#fff0a0" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-11" y1="0" x2="11" y2="0" stroke="#fff0a0" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-8" y1="-8" x2="8" y2="8" stroke="rgba(255,240,140,0.70)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8" y1="-8" x2="-8" y2="8" stroke="rgba(255,240,140,0.70)" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
