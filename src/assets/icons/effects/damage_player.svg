<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
  <rect width="100" height="100" fill="rgba(40,4,4,0.30)"/>

  <!-- Расширяющиеся красные кольца опасности -->
  <circle cx="50" cy="50" r="5" fill="none" stroke="rgba(220,38,38,0.82)" stroke-width="2.2">
    <animate attributeName="r" values="5;47" dur="2.1s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.92;0" dur="2.1s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="50" r="5" fill="none" stroke="rgba(220,38,38,0.82)" stroke-width="2.2">
    <animate attributeName="r" values="5;47" dur="2.1s" begin="-0.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.92;0" dur="2.1s" begin="-0.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="50" r="5" fill="none" stroke="rgba(220,38,38,0.82)" stroke-width="2.2">
    <animate attributeName="r" values="5;47" dur="2.1s" begin="-1.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.92;0" dur="2.1s" begin="-1.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Падающие стрелки вниз (урон игроку) -->
  <g>
    <rect x="8" y="-32" width="5" height="22" rx="1.2" fill="rgba(225,48,48,0.88)"/>
    <polygon points="4.5,-10 15.5,-10 10,-2" fill="rgba(225,48,48,0.88)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 140" dur="2.4s" begin="0s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="28" y="-32" width="4" height="19" rx="1" fill="rgba(205,42,42,0.82)"/>
    <polygon points="25,-13 35,-13 30,-6" fill="rgba(205,42,42,0.82)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 140" dur="3.1s" begin="-0.9s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="47" y="-32" width="6" height="24" rx="1.5" fill="rgba(240,55,55,0.92)"/>
    <polygon points="43,-8 57,-8 50,0" fill="rgba(240,55,55,0.92)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 140" dur="2.0s" begin="-1.4s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="68" y="-32" width="4" height="20" rx="1" fill="rgba(215,45,45,0.84)"/>
    <polygon points="65,-12 75,-12 70,-5" fill="rgba(215,45,45,0.84)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 140" dur="2.7s" begin="-0.4s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="86" y="-32" width="5" height="21" rx="1.2" fill="rgba(230,50,50,0.86)"/>
    <polygon points="82.5,-11 93.5,-11 88,-3" fill="rgba(230,50,50,0.86)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 140" dur="3.4s" begin="-2.1s" repeatCount="indefinite"/>
  </g>
</svg>
