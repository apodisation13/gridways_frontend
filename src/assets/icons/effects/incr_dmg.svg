<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
  <rect width="100" height="100" fill="rgba(22,6,2,0.30)"/>

  <!-- Тлеющий центральный ореол -->
  <circle cx="50" cy="50" r="20" fill="rgba(220,80,20,0.07)">
    <animate attributeName="r" values="16;26;16" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Поднимающиеся мечи -->
  <!-- sword 1, small -->
  <g>
    <polygon points="10,103 8,116 12,116" fill="#d4d4d4"/>
    <rect x="5.5" y="115" width="9" height="1.8" rx="0.6" fill="#9a6028"/>
    <rect x="8.5" y="116.8" width="3" height="4" rx="0.5" fill="#7a4020"/>
    <circle cx="10" cy="122.5" r="2" fill="#b07828"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -152" dur="2.6s" begin="0s" repeatCount="indefinite"/>
  </g>
  <!-- sword 2, medium -->
  <g>
    <polygon points="28,103 25.5,120 30.5,120" fill="#d8d8d8"/>
    <rect x="23" y="119" width="11" height="2" rx="0.6" fill="#a06830"/>
    <rect x="26.5" y="121" width="3.5" height="5" rx="0.5" fill="#7a4020"/>
    <circle cx="28" cy="127.5" r="2.2" fill="#b08030"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -152" dur="3.3s" begin="0.9s" repeatCount="indefinite"/>
  </g>
  <!-- sword 3, large (center) -->
  <g>
    <polygon points="47,103 44,124 50,124" fill="#e8e8e8"/>
    <rect x="41" y="123" width="12" height="2.2" rx="0.7" fill="#a87040"/>
    <rect x="44.5" y="125.2" width="5" height="6" rx="0.6" fill="#7a4820"/>
    <circle cx="47" cy="133" r="2.8" fill="#c08840"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -152" dur="2.1s" begin="1.5s" repeatCount="indefinite"/>
  </g>
  <!-- sword 4, medium -->
  <g>
    <polygon points="65,103 62.5,118 67.5,118" fill="#d6d6d6"/>
    <rect x="60" y="117" width="11" height="1.8" rx="0.5" fill="#906030"/>
    <rect x="63.5" y="118.8" width="3" height="4.5" rx="0.5" fill="#703820"/>
    <circle cx="65" cy="125" r="2" fill="#b07830"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -152" dur="3.6s" begin="0.3s" repeatCount="indefinite"/>
  </g>
  <!-- sword 5, small -->
  <g>
    <polygon points="83,103 81.2,114 84.8,114" fill="#cccccc"/>
    <rect x="78.7" y="113" width="8.6" height="1.6" rx="0.5" fill="#885028"/>
    <rect x="81.5" y="114.6" width="3" height="3.8" rx="0.5" fill="#683018"/>
    <circle cx="83" cy="120" r="1.8" fill="#a06828"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -152" dur="2.9s" begin="2.1s" repeatCount="indefinite"/>
  </g>
  <!-- sword 6, medium-small -->
  <g>
    <polygon points="18,103 16,116 20,116" fill="#d0d0d0"/>
    <rect x="13.5" y="115" width="9" height="1.7" rx="0.5" fill="#906030"/>
    <rect x="16.5" y="116.7" width="3" height="4.2" rx="0.5" fill="#703820"/>
    <circle cx="18" cy="122.6" r="2" fill="#a87030"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -152" dur="4.1s" begin="1.2s" repeatCount="indefinite"/>
  </g>

  <!-- Огненные искры между мечами -->
  <circle cx="37" cy="100" r="2.2" fill="rgba(255,120,30,0.75)">
    <animateTransform attributeName="transform" type="translate" values="0 0;-4 -130" dur="1.8s" begin="-0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.80;0" dur="1.8s" begin="-0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="55" cy="100" r="1.8" fill="rgba(255,90,20,0.70)">
    <animateTransform attributeName="transform" type="translate" values="0 0;3 -130" dur="2.2s" begin="-1.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.80;0" dur="2.2s" begin="-1.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="74" cy="100" r="2.5" fill="rgba(255,140,40,0.78)">
    <animateTransform attributeName="transform" type="translate" values="0 0;-2 -130" dur="1.5s" begin="-2.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;0" dur="1.5s" begin="-2.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="22" cy="100" r="1.5" fill="rgba(255,100,25,0.65)">
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -130" dur="2.6s" begin="-0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.75;0" dur="2.6s" begin="-0.8s" repeatCount="indefinite"/>
  </circle>
</svg>
