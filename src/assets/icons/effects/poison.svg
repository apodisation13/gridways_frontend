<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Green toxic spikes -->
  <line x1="50" y1="18" x2="50" y2="6"  stroke="rgba(80,200,40,0.72)" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="71" y1="24" x2="79" y2="14" stroke="rgba(80,200,40,0.72)" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="82" y1="45" x2="94" y2="43" stroke="rgba(80,200,40,0.72)" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="76" y1="67" x2="85" y2="75" stroke="rgba(80,200,40,0.72)" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="50" y1="79" x2="50" y2="91" stroke="rgba(80,200,40,0.72)" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="24" y1="67" x2="16" y2="75" stroke="rgba(80,200,40,0.72)" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="18" y1="45" x2="6"  y2="43" stroke="rgba(80,200,40,0.72)" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="29" y1="24" x2="21" y2="14" stroke="rgba(80,200,40,0.72)" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Dark green body -->
  <circle cx="50" cy="50" r="30" fill="rgba(12,45,8,0.88)" stroke="rgba(70,175,30,0.65)" stroke-width="2"/>

  <!-- Toxic inner glow -->
  <circle cx="50" cy="50" r="22" fill="rgba(40,140,15,0.22)"/>

  <!-- Subtle highlight -->
  <circle cx="39" cy="39" r="8" fill="rgba(120,230,60,0.07)"/>

  <!-- Toxic drip at top (where mine has a detonator) -->
  <path d="M50 20 Q47 25 50 29 Q53 25 50 20" fill="rgba(80,200,40,0.72)"/>

  <!-- Skull head -->
  <ellipse cx="50" cy="47" rx="13" ry="14" fill="rgba(90,210,45,0.75)"/>

  <!-- Eye sockets -->
  <ellipse cx="44" cy="44.5" rx="3.8" ry="4.2" fill="rgba(8,38,5,0.92)"/>
  <ellipse cx="56" cy="44.5" rx="3.8" ry="4.2" fill="rgba(8,38,5,0.92)"/>

  <!-- Nose cavity -->
  <ellipse cx="50" cy="52" rx="2.2" ry="1.8" fill="rgba(8,38,5,0.78)"/>

  <!-- Jaw -->
  <rect x="39" y="58" width="22" height="5" rx="2.5" fill="rgba(90,210,45,0.75)"/>

  <!-- Teeth dividers -->
  <line x1="45.5" y1="58" x2="45.5" y2="63" stroke="rgba(12,45,8,0.88)" stroke-width="1.6"/>
  <line x1="50"   y1="58" x2="50"   y2="63" stroke="rgba(12,45,8,0.88)" stroke-width="1.6"/>
  <line x1="54.5" y1="58" x2="54.5" y2="63" stroke="rgba(12,45,8,0.88)" stroke-width="1.6"/>
</svg>
