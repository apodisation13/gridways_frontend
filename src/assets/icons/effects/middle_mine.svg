<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
  <!-- Orange-red atmosphere -->
  <rect width="100" height="100" fill="rgba(210,80,40,0.10)"/>

  <!-- Three expanding dispel rings -->
  <circle cx="50" cy="50" r="5" fill="none" stroke="rgba(230,95,55,0.80)" stroke-width="1.8">
    <animate attributeName="r" values="5;47" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.90;0" dur="2.4s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="50" r="5" fill="none" stroke="rgba(230,95,55,0.80)" stroke-width="1.8">
    <animate attributeName="r" values="5;47" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.90;0" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="50" r="5" fill="none" stroke="rgba(230,95,55,0.80)" stroke-width="1.8">
    <animate attributeName="r" values="5;47" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.90;0" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Rotating dashed ring -->
  <circle cx="50" cy="50" r="22" fill="none" stroke="rgba(240,120,70,0.32)" stroke-width="1.3" stroke-dasharray="5 4">
    <animateTransform attributeName="transform" type="rotate" values="0 50 50;360 50 50" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Central X (remove/cancel symbol) -->
  <line x1="39" y1="39" x2="61" y2="61" stroke="rgba(245,120,80,0.88)" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="61" y1="39" x2="39" y2="61" stroke="rgba(245,120,80,0.88)" stroke-width="3.2" stroke-linecap="round"/>
</svg>
