<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
  <rect width="100" height="100" fill="rgba(8,4,3,0.28)"/>

  <!-- blood-red glow pulse on floor -->
  <rect x="0" y="82" width="100" height="18" fill="rgba(140,20,10,0.0)">
    <animate attributeName="fill" values="rgba(140,20,10,0.0);rgba(140,20,10,0.28);rgba(140,20,10,0.0)" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- spike 1 -->
  <polygon points="7,100 13,44 19,100" fill="#7a7070"/>
  <polygon points="7,100 13,44 19,100" fill="rgba(255,255,255,0.06)">
    <animate attributeName="opacity" values="0;1;0" dur="3.1s" begin="0s" repeatCount="indefinite"/>
  </polygon>

  <!-- spike 2 -->
  <polygon points="18,100 23,58 28,100" fill="#6e6868"/>
  <polygon points="18,100 23,58 28,100" fill="rgba(255,255,255,0.07)">
    <animate attributeName="opacity" values="0;1;0" dur="2.7s" begin="0.4s" repeatCount="indefinite"/>
  </polygon>

  <!-- spike 3 tallest left -->
  <polygon points="28,100 35,30 42,100" fill="#888080"/>
  <polygon points="28,100 35,30 42,100" fill="rgba(255,255,255,0.08)">
    <animate attributeName="opacity" values="0;1;0" dur="3.8s" begin="1.1s" repeatCount="indefinite"/>
  </polygon>

  <!-- spike 4 -->
  <polygon points="40,100 46,50 52,100" fill="#737070"/>
  <polygon points="40,100 46,50 52,100" fill="rgba(255,255,255,0.06)">
    <animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="0.7s" repeatCount="indefinite"/>
  </polygon>

  <!-- spike 5 tallest center -->
  <polygon points="52,100 60,22 68,100" fill="#8a8282"/>
  <polygon points="52,100 60,22 68,100" fill="rgba(255,255,255,0.09)">
    <animate attributeName="opacity" values="0;1;0" dur="4.2s" begin="2.0s" repeatCount="indefinite"/>
  </polygon>

  <!-- spike 6 -->
  <polygon points="66,100 72,52 78,100" fill="#706868"/>
  <polygon points="66,100 72,52 78,100" fill="rgba(255,255,255,0.06)">
    <animate attributeName="opacity" values="0;1;0" dur="3.3s" begin="1.5s" repeatCount="indefinite"/>
  </polygon>

  <!-- spike 7 -->
  <polygon points="77,100 82,62 87,100" fill="#686060"/>
  <polygon points="77,100 82,62 87,100" fill="rgba(255,255,255,0.07)">
    <animate attributeName="opacity" values="0;1;0" dur="2.9s" begin="0.9s" repeatCount="indefinite"/>
  </polygon>

  <!-- spike 8 -->
  <polygon points="86,100 91,48 96,100" fill="#757070"/>
  <polygon points="86,100 91,48 96,100" fill="rgba(255,255,255,0.06)">
    <animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
  </polygon>

  <!-- blood drip from spike 3 tip — drops grow downward then vanish -->
  <circle cx="35" cy="33" r="2.2" fill="rgba(190,20,8,0)">
    <animate attributeName="fill" values="rgba(190,20,8,0);rgba(190,20,8,0.90);rgba(190,20,8,0)" dur="3.8s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <rect x="33.5" y="35" width="3" height="0" rx="1.5" fill="rgba(170,15,6,0.85)">
    <animate attributeName="height" values="0;16;0" dur="3.8s" begin="0.5s" repeatCount="indefinite"/>
  </rect>

  <!-- blood drip from spike 5 tip -->
  <circle cx="60" cy="25" r="2.8" fill="rgba(190,20,8,0)">
    <animate attributeName="fill" values="rgba(190,20,8,0);rgba(190,20,8,0.90);rgba(190,20,8,0)" dur="4.2s" begin="2.2s" repeatCount="indefinite"/>
  </circle>
  <rect x="58.5" y="27.5" width="3" height="0" rx="1.5" fill="rgba(170,15,6,0.85)">
    <animate attributeName="height" values="0;20;0" dur="4.2s" begin="2.2s" repeatCount="indefinite"/>
  </rect>
</svg>
