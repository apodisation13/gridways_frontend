<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
  <!-- Dark metallic atmosphere -->
  <rect width="100" height="100" fill="rgba(12,10,10,0.24)"/>

  <!-- Perimeter spikes: slow collective shimmer -->
  <g>
    <animate attributeName="opacity" values="0.78;0.97;0.78" dur="3.2s" repeatCount="indefinite"/>

    <!-- TOP edge: spikes pointing DOWN -->
    <polygon points="6,0  12,0  9,10"      fill="rgba(185,190,206,0.85)"/>
    <polygon points="16,0 21,0  18.5,7"    fill="rgba(175,180,196,0.78)"/>
    <polygon points="25,0 31,0  28,12"     fill="rgba(190,195,211,0.88)"/>
    <polygon points="36,0 41,0  38.5,8"    fill="rgba(178,183,199,0.80)"/>
    <polygon points="47,0 53,0  50,13"     fill="rgba(194,199,215,0.90)">
      <animate attributeName="fill" values="rgba(194,199,215,0.90);rgba(222,227,242,0.99);rgba(194,199,215,0.90)" dur="1.9s" begin="0.4s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="60,0 65,0  62.5,8"    fill="rgba(178,183,199,0.80)"/>
    <polygon points="70,0 76,0  73,12"     fill="rgba(190,195,211,0.88)"/>
    <polygon points="80,0 85,0  82.5,7"    fill="rgba(175,180,196,0.78)"/>
    <polygon points="89,0 95,0  92,10"     fill="rgba(185,190,206,0.85)"/>

    <!-- BOTTOM edge: spikes pointing UP -->
    <polygon points="6,100  12,100  9,90"       fill="rgba(185,190,206,0.85)"/>
    <polygon points="16,100 21,100  18.5,93"    fill="rgba(175,180,196,0.78)"/>
    <polygon points="25,100 31,100  28,88"      fill="rgba(190,195,211,0.88)"/>
    <polygon points="36,100 41,100  38.5,92"    fill="rgba(178,183,199,0.80)"/>
    <polygon points="47,100 53,100  50,87"      fill="rgba(194,199,215,0.90)">
      <animate attributeName="fill" values="rgba(194,199,215,0.90);rgba(222,227,242,0.99);rgba(194,199,215,0.90)" dur="2.3s" begin="1.1s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="60,100 65,100  62.5,92"    fill="rgba(178,183,199,0.80)"/>
    <polygon points="70,100 76,100  73,88"      fill="rgba(190,195,211,0.88)"/>
    <polygon points="80,100 85,100  82.5,93"    fill="rgba(175,180,196,0.78)"/>
    <polygon points="89,100 95,100  92,90"      fill="rgba(185,190,206,0.85)"/>

    <!-- LEFT edge: spikes pointing RIGHT -->
    <polygon points="0,9   0,15   10,12"    fill="rgba(182,187,203,0.82)"/>
    <polygon points="0,22  0,28   12,25"    fill="rgba(192,197,213,0.87)"/>
    <polygon points="0,35  0,40   8,37.5"   fill="rgba(178,183,199,0.80)"/>
    <polygon points="0,47  0,53   13,50"    fill="rgba(194,199,215,0.90)"/>
    <polygon points="0,61  0,67   8,64"     fill="rgba(178,183,199,0.80)"/>
    <polygon points="0,73  0,79   12,76"    fill="rgba(190,195,211,0.87)"/>
    <polygon points="0,85  0,91   10,88"    fill="rgba(182,187,203,0.82)"/>

    <!-- RIGHT edge: spikes pointing LEFT -->
    <polygon points="100,9   100,15   90,12"    fill="rgba(182,187,203,0.82)"/>
    <polygon points="100,22  100,28   88,25"    fill="rgba(192,197,213,0.87)"/>
    <polygon points="100,35  100,40   92,37.5"  fill="rgba(178,183,199,0.80)"/>
    <polygon points="100,47  100,53   87,50"    fill="rgba(194,199,215,0.90)"/>
    <polygon points="100,61  100,67   92,64"    fill="rgba(178,183,199,0.80)"/>
    <polygon points="100,73  100,79   88,76"    fill="rgba(190,195,211,0.87)"/>
    <polygon points="100,85  100,91   90,88"    fill="rgba(182,187,203,0.82)"/>
  </g>

  <!-- Pulsing glow at center -->
  <circle cx="50" cy="50" r="14" fill="rgba(190,195,212,0.16)">
    <animate attributeName="r"       values="14;21;14" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Static outer ring -->
  <circle cx="50" cy="50" r="19" fill="none" stroke="rgba(185,190,208,0.32)" stroke-width="1.2"/>

  <!-- Rotating 4-pointed star (outer_r=15, inner_r=5.5, 45° diagonals) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 50 50;360 50 50" dur="9s" repeatCount="indefinite"/>
    <polygon
      points="50,35 53.89,46.11 65,50 53.89,53.89 50,65 46.11,53.89 35,50 46.11,46.11"
      fill="rgba(190,195,210,0.82)" stroke="rgba(218,222,235,0.40)" stroke-width="0.8"/>
  </g>

  <!-- Static center dot -->
  <circle cx="50" cy="50" r="4" fill="rgba(160,165,180,0.90)" stroke="rgba(200,205,222,0.50)" stroke-width="0.8"/>
</svg>
