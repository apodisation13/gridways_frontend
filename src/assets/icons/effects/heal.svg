    <animateTransform attributeName="transform" type="translate" values="0 0;0 -148" dur="3.6s" begin="0.8s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="52" y="104" width="7" height="16" rx="2" fill="rgba(100,245,100,0.92)"/>
    <rect x="47" y="109" width="17" height="7" rx="2" fill="rgba(100,245,100,0.92)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -148" dur="2.2s" begin="1.3s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="73" y="104" width="5" height="11" rx="1.5" fill="rgba(65,210,65,0.86)"/>
