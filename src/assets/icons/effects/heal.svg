<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
  <rect width="100" height="100" fill="rgba(4,18,6,0.28)"/>

  <!-- Центральное постоянное свечение -->
  <circle cx="50" cy="50" r="22" fill="rgba(40,200,40,0.06)">
    <animate attributeName="r" values="18;26;18" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Поднимающиеся кресты — крупные, яркие -->
  <g>
    <rect x="11" y="104" width="8" height="18" rx="2.5" fill="rgba(85,235,85,0.94)"/>
    <rect x="6" y="109" width="18" height="8" rx="2.5" fill="rgba(85,235,85,0.94)"/>
    <!-- Контур-ореол -->
    <rect x="9.5" y="102.5" width="11" height="21" rx="3" fill="none" stroke="rgba(120,255,120,0.30)" stroke-width="1.5"/>
    <rect x="4.5" y="107.5" width="21" height="11" rx="3" fill="none" stroke="rgba(120,255,120,0.30)" stroke-width="1.5"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -152" dur="2.8s" begin="0s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="32" y="104" width="6" height="14" rx="2" fill="rgba(60,210,60,0.88)"/>
    <rect x="29" y="107" width="12" height="6" rx="2" fill="rgba(60,210,60,0.88)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -152" dur="3.6s" begin="0.9s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="51" y="104" width="9" height="20" rx="2.5" fill="rgba(105,250,105,0.95)"/>
    <rect x="46" y="109" width="19" height="9" rx="2.5" fill="rgba(105,250,105,0.95)"/>
    <!-- Контур-ореол -->
    <rect x="49.5" y="102.5" width="12" height="23" rx="3" fill="none" stroke="rgba(140,255,140,0.32)" stroke-width="1.5"/>
    <rect x="44.5" y="107.5" width="22" height="12" rx="3" fill="none" stroke="rgba(140,255,140,0.32)" stroke-width="1.5"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -152" dur="2.2s" begin="1.4s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="73" y="104" width="6" height="13" rx="2" fill="rgba(70,215,70,0.88)"/>
    <rect x="70" y="107" width="12" height="6" rx="2" fill="rgba(70,215,70,0.88)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -152" dur="3.1s" begin="2.0s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="86" y="104" width="7" height="16" rx="2" fill="rgba(90,235,90,0.90)"/>
    <rect x="82" y="108" width="15" height="7" rx="2" fill="rgba(90,235,90,0.90)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -152" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="22" y="104" width="5" height="11" rx="1.5" fill="rgba(48,185,48,0.82)"/>
    <rect x="19.5" y="106.5" width="10" height="5" rx="1.5" fill="rgba(48,185,48,0.82)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -152" dur="4.2s" begin="2.5s" repeatCount="indefinite"/>
  </g>

  <!-- Маленькие искры-точки -->
  <circle cx="15" cy="100" r="2" fill="rgba(100,255,100,0.60)">
    <animateTransform attributeName="transform" type="translate" values="0 0;5 -130" dur="2.0s" begin="-0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2.0s" begin="-0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="63" cy="100" r="1.5" fill="rgba(80,240,80,0.55)">
    <animateTransform attributeName="transform" type="translate" values="0 0;-3 -130" dur="2.5s" begin="-1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2.5s" begin="-1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="42" cy="100" r="2.2" fill="rgba(120,255,120,0.65)">
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -130" dur="1.8s" begin="-1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="1.8s" begin="-1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
