    <animateTransform attributeName="transform" type="translate" values="0 0;0 -148" dur="2.8s" begin="0s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="32" y="104" width="5" height="12" rx="1.5" fill="rgba(55,200,55,0.85)"/>
