    <animateTransform attributeName="transform" type="translate" values="0 0;0 -148" dur="3.0s" begin="1.9s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="87" y="104" width="6" height="13" rx="2" fill="rgba(85,230,85,0.88)"/>
